name: Go Test CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Bạn có thể đổi thành version bạn đang dùng
          cache: true        # Tự động cache các gói Go Modules để chạy nhanh hơn

      # Bước 3: Tải các thư viện (dependencies)
      - name: Install dependencies
        run: go mod download

      # Bước 4: Chạy Unit Test
      # -v: hiển thị chi tiết log từng test case
      # -race: kiểm tra lỗi tranh chấp bộ nhớ (rất quan trọng trong Go)
      - name: Run Tests
        run: go test -v -race ./...

      # Bước 5: (Tùy chọn) Kiểm tra format code
      - name: Check formatting
        run: go fmt ./... && git diff --exit-code